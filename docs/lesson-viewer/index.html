<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Instruments lesson</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c1b19'/%3E%3Crect x='4.75' y='10.75' width='10.5' height='10.5' fill='none' stroke='%23ebe7db' stroke-width='1.5'/%3E%3Crect x='17' y='10' width='12' height='12' fill='%23ebe7db'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-D63axPm4.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-XKyaHtl9.js">
    <link rel="stylesheet" crossorigin href="./assets/index-Dny76rB1.css">
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="wordmark">Visual Instruments</div>

        <nav class="stepper" aria-label="Sketches">
          <button class="step-arrow" id="prev" aria-label="Previous step" title="Previous step (←)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
          </button>
          <ol class="steps" id="steps"></ol>
          <button class="step-arrow" id="next" aria-label="Next step" title="Next step (→)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
          </button>
        </nav>

        <div class="controls">
          <div class="segmented" role="group" aria-label="Code view" id="mode">
            <button type="button" data-mode="code" title="Both sketches, editable (D to switch)">Code</button>
            <button type="button" data-mode="diff" title="What changed between them (D to switch)">Diff</button>
          </div>
          <div class="segmented" role="group" aria-label="Diff layout" id="diff-style">
            <button type="button" data-style="split">Split</button>
            <button type="button" data-style="unified">Unified</button>
          </div>
          <div class="text-size" role="group" aria-label="Code text size">
            <button type="button" id="smaller" aria-label="Smaller code text" title="Smaller code text">A−</button>
            <button type="button" id="larger" aria-label="Larger code text" title="Larger code text">A+</button>
          </div>
        </div>
      </header>

      <section class="code-area" id="code-area" aria-label="Code">
        <div class="code-heads" id="code-heads"></div>
        <div class="code-body" id="code-body"></div>
      </section>

      <div
        class="divider"
        id="divider"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize code and sketches"
        title="Drag to resize"
        tabindex="0"
      ></div>

      <section class="sketch-area" id="sketch-area" aria-label="Running sketches"></section>
    </div>
  </body>
</html>
